<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apoiar os Futuros Projetos</title><style>:root{--bg:#111b16;--panel:#1c2b21;--text:#eff7eb;--muted:#b9c9b8;--green:#80c778}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 40px));margin:auto;padding:80px 0}.eyebrow{color:var(--green);font-size:.75rem;font-weight:800;letter-spacing:.12em}.card{padding:clamp(26px,5vw,54px);background:var(--panel);border:1px solid #426448;box-shadow:0 24px 70px #0005}h1{font-size:clamp(2.7rem,7vw,5.2rem);line-height:.95;margin:15px 0 22px}h1 span{color:var(--green)}p{max-width:58ch;color:var(--muted)}.pix{display:grid;grid-template-columns:190px 1fr;gap:32px;align-items:center;margin-top:34px;padding-top:34px;border-top:1px solid #426448}.pix img{width:190px;padding:10px;background:#fff}code{display:block;padding:14px;background:#101a13;color:#a9e69f;overflow-wrap:anywhere}button{margin-top:18px;padding:14px 18px;border:0;background:var(--green);color:#102012;font-weight:800;cursor:pointer}.back{display:inline-block;margin-top:34px;color:#a9e69f}@media(max-width:560px){.pix{grid-template-columns:1fr}}</style></head><body><main class="wrap"><p class="eyebrow">APOIO AO DESENVOLVIMENTO</p><section class="card"><h1>Apoiar os<br><span>Futuros Projetos.</span></h1><p>Você pode contribuir com qualquer valor para ajudar a manter os próximos jogos e experimentos em desenvolvimento.</p><div class="pix"><img src="assets/pix-support-qr.svg" alt="QR Code Pix para apoiar os futuros projetos"><div><p class="eyebrow">PIX · VALOR LIVRE</p><p>Escaneie o código no banco ou copie a chave.</p><code>651ffdb7-487f-48d7-9fa8-a56469306f04</code><button onclick="navigator.clipboard.writeText('651ffdb7-487f-48d7-9fa8-a56469306f04');this.textContent='CHAVE COPIADA ✓'">Copiar chave Pix</button></div></div><a class="back" href="index.html">← Voltar a
